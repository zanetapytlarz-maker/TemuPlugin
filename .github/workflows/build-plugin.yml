name: Build TEMU Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build MasowaWaga
        run: dotnet build MasowaWaga/MasowaWaga.csproj -c Release
      - name: Upload MasowaWaga DLL
        uses: actions/upload-artifact@v4
        with:
          name: MasowaWaga-DLL
          path: "MasowaWaga/bin/Release/net48/ELEKTROMET - MasowaWaga.dll"
