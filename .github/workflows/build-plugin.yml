name: Build EasyUploader Diagnostics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build diagnostics
        run: dotnet build DiagnostykaEU/DiagnostykaEU.csproj -c Release
      - name: Upload diagnostics DLL
        uses: actions/upload-artifact@v4
        with:
          name: DiagnostykaEdycji-DLL
          path: "DiagnostykaEU/bin/Release/net48/ELEKTROMET - DiagnostykaEdycji.dll"
