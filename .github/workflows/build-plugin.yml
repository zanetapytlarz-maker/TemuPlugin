name: Build EasyUploader FakturyAuto

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Patch compatibility and Allegro auth
        shell: pwsh
        run: |
          $p = 'FakturyAuto/PluginEU.cs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('private static Timer _timer;', 'private static System.Threading.Timer _timer;')
          $s = $s.Replace('_timer = new Timer(', '_timer = new System.Threading.Timer(')
          $old = 'h.DefaultRequestHeaders.Authorization=new AuthenticationHeaderValue("Bearer",token);'
          $new = 'token=(token??"").Trim(); if(token.StartsWith("Bearer ",StringComparison.OrdinalIgnoreCase)) token=token.Substring(7).Trim(); h.DefaultRequestHeaders.Authorization=new AuthenticationHeaderValue("Bearer",token);'
          $s = $s.Replace($old, $new)
          Set-Content $p $s -Encoding UTF8
      - name: Build FakturyAuto
        run: dotnet build FakturyAuto/FakturyAuto.csproj -c Release
      - name: Upload FakturyAuto DLL
        uses: actions/upload-artifact@v4
        with:
          name: FakturyAuto-DLL
          path: "FakturyAuto/bin/Release/net48/ELEKTROMET - FakturyAuto.dll"
