name: Build EasyUploader Employee Lock

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build employee lock
        run: dotnet build BlokadaEdycji/BlokadaEdycji.csproj -c Release
      - name: Upload lock DLL
        uses: actions/upload-artifact@v4
        with:
          name: BlokadaEdycji-DLL
          path: "BlokadaEdycji/bin/Release/net48/ELEKTROMET - BlokadaEdycji.dll"
